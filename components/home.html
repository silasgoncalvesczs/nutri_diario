<section id="home-screen" class="page-section active">
    <div
        class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 mb-6 dark:bg-dark-surface dark:border-dark-border transition-colors duration-300">
        <div class="flex justify-between items-end mb-4">
            <div>
                <div class="flex items-center gap-2 mb-1">
                    <button onclick="changeDashboardDate(-1)"
                        class="text-gray-400 hover:text-primary-500 transition-colors px-2 py-1 rounded-lg bg-gray-50 dark:bg-dark-bg active:scale-95">
                        <i class="fas fa-chevron-left text-xs"></i>
                    </button>
                    <p id="dashboard-date-display"
                        class="text-sm text-gray-500 font-bold dark:text-gray-400 w-28 text-center select-none">
                        Hoje
                    </p>
                    <button onclick="changeDashboardDate(1)"
                        class="text-gray-400 hover:text-primary-500 transition-colors px-2 py-1 rounded-lg bg-gray-50 dark:bg-dark-bg active:scale-95">
                        <i class="fas fa-chevron-right text-xs"></i>
                    </button>
                </div>

                <h2 class="text-3xl font-bold text-gray-800 dark:text-white">
                    <span id="dashboard-cals">0</span> <span
                        class="text-sm text-gray-400 font-normal dark:text-gray-500">/ <span
                            id="dashboard-goal">2000</span> kcal</span>
                </h2>
            </div>
            <div id="dashboard-percent" class="text-2xl font-bold text-primary-600 dark:text-primary-400">0%</div>
        </div>
        <div class="w-full bg-gray-100 rounded-full h-3 mb-6 overflow-hidden dark:bg-gray-700">
            <div id="progress-bar-cals" class="bg-primary-500 h-3 rounded-full transition-all duration-1000 ease-out"
                style="width: 0%"></div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div class="bg-blue-50 p-3 rounded-xl dark:bg-blue-900/20 dark:border dark:border-blue-900/50">
                <div class="flex items-center gap-2 mb-1">
                    <div class="w-2 h-2 rounded-full bg-blue-500"></div><span
                        class="text-xs font-bold text-blue-700 uppercase dark:text-blue-300">Proteínas</span>
                </div>
                <p class="text-lg font-bold text-gray-700 dark:text-gray-200"><span id="dashboard-protein">0</span><span
                        class="text-xs text-gray-500 font-normal dark:text-gray-400">/ <span
                            id="dashboard-protein-goal">0</span>g</span></p>
            </div>
            <div class="bg-orange-50 p-3 rounded-xl dark:bg-orange-900/20 dark:border dark:border-orange-900/50">
                <div class="flex items-center gap-2 mb-1">
                    <div class="w-2 h-2 rounded-full bg-orange-500"></div><span
                        class="text-xs font-bold text-orange-700 uppercase dark:text-orange-300">Carboidratos</span>
                </div>
                <p class="text-lg font-bold text-gray-700 dark:text-gray-200"><span id="dashboard-carbs">0</span><span
                        class="text-xs text-gray-500 font-normal dark:text-gray-400">/ <span
                            id="dashboard-carbs-goal">0</span>g</span></p>
            </div>
            <div class="bg-yellow-50 p-3 rounded-xl dark:bg-yellow-900/20 dark:border dark:border-yellow-900/50">
                <div class="flex items-center gap-2 mb-1">
                    <div class="w-2 h-2 rounded-full bg-yellow-500"></div><span
                        class="text-xs font-bold text-yellow-700 uppercase dark:text-yellow-300">Gorduras</span>
                </div>
                <p class="text-lg font-bold text-gray-700 dark:text-gray-200"><span id="dashboard-fats">0</span><span
                        class="text-xs text-gray-500 font-normal dark:text-gray-400">/ <span
                            id="dashboard-fats-goal">0</span>g</span></p>
            </div>
            <div class="bg-green-50 p-3 rounded-xl dark:bg-green-900/20 dark:border dark:border-green-900/50">
                <div class="flex items-center gap-2 mb-1">
                    <div class="w-2 h-2 rounded-full bg-green-500"></div><span
                        class="text-xs font-bold text-green-700 uppercase dark:text-green-300">Fibras</span>
                </div>
                <p class="text-lg font-bold text-gray-700 dark:text-gray-200"><span id="dashboard-fibers">0</span><span
                        class="text-xs text-gray-500 font-normal dark:text-gray-400">/ <span
                            id="dashboard-fibers-goal">0</span>g</span></p>
            </div>
        </div>
    </div>

    <button onclick="navigateTo('calculator')"
        class="w-full bg-gradient-to-r from-primary-600 to-primary-500 text-white p-4 rounded-xl shadow-lg shadow-primary-500/30 flex items-center justify-center gap-3 hover:scale-[1.02] active:scale-[0.98] transition-all dark:shadow-none">
        <i class="fas fa-plus-circle text-xl"></i><span class="font-bold">Nova Refeição</span>
    </button>

    <div class="bg-dark-surface border border-yellow-500/20 rounded-xl p-5 shadow-sm mt-6 relative overflow-hidden">
        <div class="absolute top-0 right-0 p-3 opacity-10 text-yellow-500">
            <i class="fas fa-brain text-4xl"></i>
        </div>
        <div class="flex gap-3 relative z-10">
            <i class="fas fa-magic text-yellow-500 mt-1 animate-pulse"></i>
            <div class="flex-1">
                <h4 class="text-yellow-500 font-bold text-sm mb-1 flex justify-between items-center">
                    Nutri IA
                    <button onclick="generateAITip()"
                        class="text-xs bg-yellow-500/10 hover:bg-yellow-500/30 text-yellow-500 px-2 py-1 rounded transition-colors active:scale-95">
                        <i class="fas fa-sync-alt"></i> Gerar Dica
                    </button>
                </h4>
                <p id="ai-tip-text" class="text-yellow-500/80 text-sm leading-relaxed">
                    Clique em gerar para receber uma sugestão baseada nos seus macros de hoje!
                </p>
            </div>
        </div>
    </div>
</section>
